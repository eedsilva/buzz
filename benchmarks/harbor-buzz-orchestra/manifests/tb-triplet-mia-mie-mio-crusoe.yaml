# Triplet: Mia (conn) + Mie (adaptive worker) + Mio (independent verifier) —
# smoke of the verify-as-gate composition from the Eva/Wren joint rec
# (buzz-benchmarking thread b6cdc4df, Tyler order bc37c9e7, 2026-08-09).
# Mio = the "Vera" design renamed per Tyler: verification-first, matrix+probes
# to .scratch/mio/ on first wake (stateless, never polls), evidence-bearing
# PASS/FAIL/BLOCKED verdicts, read-only outside her scratch, never repairs
# what she certifies. Mia carries the collapsed dispatch protocol + Mio
# verdict gate, variant B (no timing injection). Mie unchanged from twins-2.
# Known hazard, accepted: mio-1 is edit-distance 1 from mia-1/mie-1 — if a
# lane goes silent, suspect a misrouted wake first (Mia has the resend rule).
# Model/provider: Crusoe serverless deepseek-ai/Deepseek-V4-Flash (0423
# preview — NOT the 0731 our other runs use; that comparison is the point).
# Model id is case-exact: lowercase 's' in "Deepseek". Endpoint config:
# testbed/endpoints/crusoe-live.json (OPENAI_COMPAT_BASE_URL
# https://api.inference.crusoecloud.com/v1). api_key_env must be
# OPENAI_COMPAT_API_KEY — the runtime injects the key under exactly that
# name and buzz-agent's provider=openai reads only OPENAI_COMPAT_API_KEY
# (config.rs req()); a vendor-named var dies at agent config parse.
# Pricing: crusoe.ai/cloud/pricing 2026-08-07 snapshot, $0.14/$0.28 per M.
